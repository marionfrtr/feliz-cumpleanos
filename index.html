<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Feliz cumpleaños</title>
<style>
    :root {
        --blue-pastel: #89CFF0;
        --pink-pale: #FFD6E7;
    }
    html,body { margin:0; }
    body {
        font-family: Arial, sans-serif;
        background-color: var(--blue-pastel);
        position: relative;
        /* Rendu scrollable */
        overflow-x: hidden;
        overflow-y: auto; 
        min-height: 100vh;
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
    }


    h1 { color: red; text-align:center; margin-top:0; }
    p { text-align:center; font-size:20px; margin:10px 0 20px; }

    .row { display:flex; gap:30px; justify-content:space-between; align-items:center; margin:40px 0; }
    .col { width:45%; text-align:center; }
    img { width:300px; border-radius:15px; display:block; margin:auto; max-width:100%; height:auto; }
    button {
        display:block;
        margin:30px auto;
        padding:12px 25px;
        font-size:18px;
        border:none;
        border-radius:10px;
        background-color:red;
        color:white;
        cursor:pointer;
    }
    button:hover { background:#b30000; }

    #smokeLayer { pointer-events:none; position:fixed; left:0; top:0; width:100%; height:100%; overflow:hidden; z-index:1100; }

    .encadre {
        position: fixed;
        top:50%;
        left:50%;
        transform: translate(-50%,-50%);
        background: var(--pink-pale);
        border: 2px solid #FF9ABB;
        padding: 20px 28px;
        border-radius: 14px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.18);
        font-size:18px;
        color:#C40050;
        text-align:center;
        z-index:1200;
    }
    .encadre button { background:#ffb3cc; color:#7a0030; padding:8px 14px; border-radius:8px; border:none; cursor:pointer; }
    
    .stage { 
        position: relative; /* Change from fixed to relative/static flow */
        max-width: 960px;
        margin: 20px auto;
        padding: 1.5rem;
    }

    @media (max-width:900px) {
        .row { flex-direction:column; gap:20px; }
        .col { width:100%; }
        .stage { left:1.5rem; right:1.5rem; top:1.5rem; bottom:1.5rem; }
    }
</style>
</head>
<body>

    <div class="border-top"></div>
    <div class="border-bottom"></div>
    <div class="border-left"></div>
    <div class="border-right"></div>

    <div class="stage" id="stage">
        <h1>Feliz cumpleaños mon coeur &lt;3</h1>
        <img src="dessin1.jpg" id="mainIntroImg" alt="dessin1" style="width:320px;">
        <button id="btnFiesta">Quieres ir a tu fiesta !</button>
    </div>

    <div id="confetti-container" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:900;"></div>
    
<script>
function rand(min,max){ return Math.random()*(max-min)+min; }

(function startInitialConfetti(){
    const container = document.getElementById('confetti-container');
    let confettiInterval = setInterval(() => {
        const c = document.createElement('div');
        c.style.position='absolute';
        const size = rand(6,14);
        c.style.width = size+'px';
        c.style.height = size+'px';
        c.style.left = rand(0, innerWidth)+'px';
        c.style.top = '-20px';
        c.style.background = `hsl(${rand(0,360)},80%,60%)`;
        c.style.opacity = rand(0.6,1);
        c.style.borderRadius = '2px';
        c.style.transform = `rotate(${rand(0,360)}deg)`;
        c.style.pointerEvents='none';
        c.style.zIndex=900;
        container.appendChild(c);
        const duration = rand(3000,6000);
        const end = innerHeight + 40;
        const start = performance.now();
        (function animate(t){
            const p = (t-start)/duration;
            if(p<1){
                c.style.top = (p*end) + 'px';
                c.style.transform = `translateY(0) rotate(${p*720}deg)`;
                requestAnimationFrame(animate);
            } else c.remove();
        })(start);
    }, 90);

    setTimeout(()=> clearInterval(confettiInterval), 3000);
})();

const stage = document.getElementById('stage');
const btnFiesta = document.getElementById('btnFiesta');

btnFiesta.addEventListener('click', () => {
    showPartyIntro();
});

function showPartyIntro(){
    clearStage();
    const title = create('h1','🎉 Bienvenida a tu fiesta mi beibi !!! 🎉');
    stage.appendChild(title);

    const row = create('div'); row.className='row';
    const colLeft = create('div'); colLeft.className = 'col';
    const colRight = create('div'); colRight.className = 'col';

    const p1 = create('p','Aunque estamos lejos ...');
    const img1 = create('img'); img1.src = 'dessin3.jpg'; img1.alt='dessin3';
    colLeft.appendChild(p1); colLeft.appendChild(img1);

    const p2 = create('p','Vamos a celebrarlo juntos 💖');
    const img2 = create('img'); img2.src = 'dessin2.jpg'; img2.alt='dessin2';
    colRight.appendChild(img2); colRight.appendChild(p2);

    row.appendChild(colLeft); row.appendChild(colRight);
    stage.appendChild(row);

    const btnNext = create('button','Por aqui ❤️');
    btnNext.addEventListener('click', () => showBlowStage(btnNext));
    stage.appendChild(btnNext);
}

function showBlowStage(prevBtn){
    clearStage();
const title = create('h1','Soplamos tus velitas juntos 🎂');
    stage.appendChild(title);
    const container = create('div');
    container.style.display = 'flex';
    container.style.justifyContent = 'center';
    container.style.alignItems = 'center';
    container.style.gap = '40px';
    container.style.marginTop = '40px';

    const imgClickable = create('img'); imgClickable.src = 'personne souffle.jpg'; imgClickable.alt='personne souffle';
    imgClickable.style.width = '250px';
    imgClickable.style.cursor = 'pointer';

    const imgFinal = create('img'); imgFinal.src = 'gateau.jpg'; imgFinal.alt='gateau';
    imgFinal.style.width = '300px';

    container.appendChild(imgClickable); container.appendChild(imgFinal);
    stage.appendChild(container);

    const gateauZone = create('div'); gateauZone.style.textAlign='center'; gateauZone.style.marginTop='35px';
    stage.appendChild(gateauZone);

    let souffles = 0;
    let locked = false;

    imgClickable.addEventListener('click', function onClickBlow(){
        if (locked) return;
        souffles++;
        if (souffles === 1){
            imgFinal.src = 'souffle1.jpg';
        } else if (souffles === 2){
            imgFinal.src = 'souffle2.jpg';
        } else if (souffles === 3){
            imgFinal.src = 'souffle3.jpg';
            
            const finalImg = create('img'); finalImg.src = 'souffler.jpg'; finalImg.style.width='300px'; finalImg.style.display='block'; finalImg.style.margin='30px auto';
            const btnSuite = create('button','Por tu regalito 🎁');
            
            gateauZone.appendChild(finalImg);
            gateauZone.appendChild(btnSuite);

            const encadre = create('div'); encadre.className = 'encadre';
            encadre.innerHTML = `
                🎉 <b>¡Bravo!</b><br><br>
                ¡Has soplado tus velitas! 🎂❤️<br><br>
            `;
            const closeBtn = create('button','Cerrar');
            closeBtn.addEventListener('click', () => {
                encadre.remove();
                stopSmoke();
            });
            encadre.appendChild(closeBtn);
            document.body.appendChild(encadre);

            startSmokeDense();

            locked = true;

            btnSuite.addEventListener('click', () => {
                showGiftSequence();
            });
        }
    }, {once:false});
}

/* Fonctions ajoutées/modifiées */

function showJajajaScreen() {
    clearStage();

    const jajaja = create('div');
    jajaja.textContent = 'JAJAJA';
    jajaja.style.position = 'fixed';
    jajaja.style.top = '0';
    jajaja.style.left = '0';
    jajaja.style.width = '100vw';
    jajaja.style.height = '100vh';
    jajaja.style.backgroundColor = 'white';
    jajaja.style.color = 'black';
    jajaja.style.fontSize = '20vw';
    jajaja.style.display = 'flex';
    jajaja.style.justifyContent = 'center';
    jajaja.style.alignItems = 'center';
    jajaja.style.textAlign = 'center';
    jajaja.style.zIndex = '2000';
    document.body.appendChild(jajaja);

    let isVisible = true;
    const blinkInterval = setInterval(() => {
        jajaja.style.opacity = isVisible ? '0' : '1';
        isVisible = !isVisible;
    }, 300);

    setTimeout(() => {
        clearInterval(blinkInterval);
        jajaja.remove();

        const messageTransition = create('div');
    messageTransition.style.textAlign = 'center';
    messageTransition.style.margin = '40px auto';
    messageTransition.innerHTML = `
        <p style="font-size: 20px;">Sabes que me gustan las bromitas ( y molestarte oups...) !</p>
    `;
    stage.appendChild(messageTransition);
        
        const btnRegalito = create('button');
        btnRegalito.innerHTML = 'Por tu verdadero regalito';
        btnRegalito.style.padding = '15px 30px';
        btnRegalito.style.fontSize = '24px';
        btnRegalito.style.display = 'block';
        btnRegalito.style.margin = '50px auto';
        btnRegalito.style.cursor = 'pointer';
        stage.appendChild(btnRegalito);

        btnRegalito.addEventListener('click', () => {
            btnRegalito.disabled = true;
            showCabaneSequence();
        });
    }, 3000);
}

function showCabaneSequence() {
    clearStage();

    const messageTransition = create('div');
    messageTransition.style.textAlign = 'center';
    messageTransition.style.margin = '40px auto';
    messageTransition.innerHTML = `
        <h2 style="color: blue;">Vamos a disfrutar juntos.</h2>
        <p style="font-size: 20px;">Yo sé que hace tiempo que quieres hacer este !</p>
    `;
    stage.appendChild(messageTransition);

    const imgCabane = create('img'); 
    imgCabane.src = 'cabane.jpg'; 
    imgCabane.style.width = '9000px'; 
    imgCabane.style.display = 'block'; 
    imgCabane.style.margin = '20px auto';
    stage.appendChild(imgCabane);

    setTimeout(() => {
        animateHeartButton();
    }, 1000);
}

function animateHeartButton() {
    const btnCoeur = create('button'); btnCoeur.innerHTML = '❤️';  
    btnCoeur.style.position='fixed'; /* Utilise fixed pour qu'il traverse l'écran quelle que soit la position du scroll */
    btnCoeur.style.top = '50%';
    btnCoeur.style.right = '-60px';
    btnCoeur.style.fontSize='48px';
    btnCoeur.style.background='transparent';
    btnCoeur.style.border='none';
    btnCoeur.style.cursor='pointer';
    btnCoeur.style.transform='translateY(-50%)';
    btnCoeur.style.zIndex='1050';
    document.body.appendChild(btnCoeur);

    const anim = btnCoeur.animate([
        { right: '-60px' },
        { right: '110vw' }
    ], { duration: 10000, easing: 'linear' });
    anim.onfinish = () => btnCoeur.remove();

    btnCoeur.addEventListener('click', () => {
        btnCoeur.remove();
        anim.cancel(); 
        startHeartGame();
    });
}


function showGiftSequence(){
    clearStage();
    
    const imgDon = create('img'); imgDon.src = 'don cadeau.jpg'; imgDon.style.width='300px'; imgDon.style.display='block'; imgDon.style.margin='40px auto'; imgDon.style.cursor='pointer';
    stage.appendChild(imgDon);

    const regaloZone = create('div'); regaloZone.style.textAlign='center'; stage.appendChild(regaloZone);
    const pingouinZone = create('div'); pingouinZone.style.textAlign='center'; stage.appendChild(pingouinZone);
    const felizZone = create('div'); felizZone.style.textAlign='center'; stage.appendChild(felizZone);

    imgDon.addEventListener('click', () => {
        imgDon.style.pointerEvents = 'none'; // Désactive le clic
        
        const imgRegalo = create('img'); imgRegalo.src='regalo.jpg'; imgRegalo.style.width='300px'; imgRegalo.style.display='block'; imgRegalo.style.margin='20px auto'; imgRegalo.style.cursor='pointer';
        regaloZone.appendChild(imgRegalo);

        imgRegalo.addEventListener('click', () => {
            imgRegalo.style.pointerEvents = 'none'; // Désactive le clic
            
            const imgPingouin = create('img'); imgPingouin.src='pingouin.jpg'; imgPingouin.style.width='300px'; imgPingouin.style.display='block'; imgPingouin.style.margin='20px auto';
            pingouinZone.appendChild(imgPingouin);

            // Ajout du bouton "Feliz?"
            const btnFeliz = create('button');
            btnFeliz.innerHTML = 'Feliz?';
            btnFeliz.style.padding = '10px 20px';
            btnFeliz.style.fontSize = '20px';
            btnFeliz.style.margin = '20px auto';
            btnFeliz.style.cursor = 'pointer';
            felizZone.appendChild(btnFeliz);

            btnFeliz.addEventListener('click', () => {
                btnFeliz.disabled = true; // Désactive le clic
                showJajajaScreen();
            });
            // L'animation du coeur n'est plus lancée ici
        });
    });
}

function startHeartGame(){
    clearStage();

    const coeurPrincipal = create('img'); coeurPrincipal.src='coeur.jpeg';
    coeurPrincipal.style.width='100px';
    coeurPrincipal.style.position='fixed'; // Position fixed pour rester dans le viewport malgré le scroll
    coeurPrincipal.style.cursor='pointer';
    coeurPrincipal.style.zIndex='1050';
    document.body.appendChild(coeurPrincipal);

    let clicks = 0;
    function randomPositionMain(){
        const margin = 100;
        const x = Math.random()*(window.innerWidth - margin) + 20;
        const y = Math.random()*(window.innerHeight - margin) + 20;
        coeurPrincipal.style.left = x + 'px';
        coeurPrincipal.style.top = y + 'px';
    }
    randomPositionMain();

    function createFloatingHeart(x,y){
        const heart = create('div');
        heart.textContent = '❤️';
        heart.style.position='fixed'; // Position fixed
        heart.style.left = x + 'px';
        heart.style.top = y + 'px';
        heart.style.fontSize = (20 + Math.random()*36) + 'px';
        heart.style.pointerEvents = 'none';
        heart.style.zIndex = 1040;
        document.body.appendChild(heart);

        const duration = 1200 + Math.random()*800;
        const dx = (Math.random()-0.5)*120;
        const dy = -120 - Math.random()*80;
        const start = performance.now();
        (function frame(t){
            const p = Math.min(1,(t-start)/duration);
            heart.style.transform = `translate(${dx*p}px, ${dy*p}px) rotate(${p*720}deg)`;
            heart.style.opacity = 1 - p;
            if(p < 1) requestAnimationFrame(frame);
            else heart.remove();
        })(start);
    }

    coeurPrincipal.addEventListener('click', () => {
        clicks++;
        const r = coeurPrincipal.getBoundingClientRect();
        const cx = r.left + r.width/2;
        const cy = r.top + r.height/2;
        for(let i=0;i<5;i++) createFloatingHeart(cx, cy);

        if(clicks < 3){
            randomPositionMain();
        } else {
            coeurPrincipal.remove();
            
            const messageWrap = create('div');
            messageWrap.style.textAlign='center';
            messageWrap.style.marginTop='40px';
            messageWrap.innerHTML = `
                <h1 style="color:red;">Bon anniversaire mon coeur!</h1>
                <p style="font-size:20px;">
                    Disfruta de tu dia especial 🎉
                    ! Solo quiero lo mejor para ti este año !
                    <br>Mucho éxito y aún más amor &lt;3
                    Te quiero mi beibi ...
                    Nos vemos pronto ! ❤️
                    </p>
            `;
            stage.appendChild(messageWrap);
        }
    });
}

let smokeInterval = null;
function startSmokeDense(){
    if(document.getElementById('smokeLayer')) return;
    const smokeLayer = create('div'); smokeLayer.id = 'smokeLayer';
    smokeLayer.style.position='fixed';
    smokeLayer.style.left='0'; smokeLayer.style.top='0';
    smokeLayer.style.width='100%'; smokeLayer.style.height='100%';
    smokeLayer.style.pointerEvents='none';
    smokeLayer.style.overflow='hidden';
    smokeLayer.style.zIndex='1100';
    document.body.appendChild(smokeLayer);

    smokeInterval = setInterval(() => {
        const count = 3 + Math.floor(Math.random()*3);
        for(let i=0;i<count;i++){
            const puff = create('div');
            const size = 40 + Math.random()*120;
            const startX = Math.random() * window.innerWidth;
            puff.style.position='absolute';
            puff.style.left = (startX - size/2) + 'px';
            puff.style.bottom = '-80px';
            puff.style.width = size + 'px';
            puff.style.height = size + 'px';
            puff.style.borderRadius = '50%';
            puff.style.background = 'radial-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.05))';
            puff.style.filter = 'blur(8px)';
            puff.style.opacity = '0.85';
            puff.style.transform = 'translateY(0) scale(1)';
            puff.style.transition = 'all 5500ms cubic-bezier(.2,.8,.2,1)';
            smokeLayer.appendChild(puff);

            setTimeout(()=> {
                const dx = (Math.random()-0.5) * 200;
                const dy = - (200 + Math.random()*420);
                puff.style.transform = `translate(${dx}px, ${dy}px) scale(${1.6 + Math.random()*1.8})`;
                puff.style.opacity = '0';
            }, 60);

            setTimeout(()=> { puff.remove(); }, 5800 + Math.random()*300);
        }
    }, 220);
}

function stopSmoke(){
    clearInterval(smokeInterval);
    smokeInterval = null;
    const layer = document.getElementById('smokeLayer');
    if(layer) layer.remove();
}

function clearStage(){
    stage.innerHTML = '';
}

function create(tag, text){
    const el = document.createElement(tag);
    if(text !== undefined) {
        if(tag === 'img') el.src = text;
        else el.textContent = text;
    }
    return el;
}

window.addEventListener('resize', () => {
    // Les éléments en position 'fixed' (cœur jeu, jajaja) gèrent mieux le resize.
    // Pas de manipulation complexe requise ici.
});
</script>
</body>
</html>
